version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: bridgechat_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bridgechat
      POSTGRES_USER: ${DB_USER:-bridgechat}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-bridgechat_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-bridgechat}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bridgechat_net

  redis:
    image: redis:7-alpine
    container_name: bridgechat_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secret} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bridgechat_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: bridgechat_backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://${DB_USER:-bridgechat}:${DB_PASSWORD:-bridgechat_secret}@postgres:5432/bridgechat
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379
      NODE_ENV: production
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/logs:/app/logs
    networks:
      - bridgechat_net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: bridgechat_admin
    restart: unless-stopped
    environment:
      VITE_API_URL: ${API_URL:-http://localhost:5000/api}
    ports:
      - "3001:80"
    depends_on:
      - backend
    networks:
      - bridgechat_net

  nginx:
    image: nginx:alpine
    container_name: bridgechat_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - backend
      - admin
    networks:
      - bridgechat_net

volumes:
  postgres_data:
  redis_data:

networks:
  bridgechat_net:
    driver: bridge
